<text x="64" y="1368" font-size="17" fill="#1d1d1f">PK = primary key (underlined) · FK = foreign key; the arrow points to the referenced primary key</text>
<text x="64" y="1398" font-size="17" fill="#1d1d1f">AKn = column of alternate (candidate) key n; columns with the same n form ONE composite UNIQUE constraint</text>
<text x="64" y="1428" font-size="17" fill="#1d1d1f">NULL = nullable column; every other column is NOT NULL · all keys are named constraints in the DDL</text>
<text x="64" y="1472" font-size="18" font-weight="700" fill="#1d1d1f">Foreign keys and ON DELETE (from pg_constraint)</text>
